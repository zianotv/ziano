<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZianoTV</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="../assets/images/icon.png" type="image/x-icon">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background-color:#091838;color:#fff;font-family:'Plus Jakarta Sans',sans-serif}
    main{width:100%;display:flex;flex-direction:column;gap:1.5rem}
    .player-stage{position:relative;width:100%;aspect-ratio:16 / 9;max-height:calc(100vh - 7rem);background:#000;overflow:hidden}
    .player-stage [hidden]{display:none!important}
    .player-stage iframe,.player-preview{position:absolute;inset:0;width:100%;height:100%;border:0}
    .player-stage iframe{z-index:0}
    .player-preview{z-index:1;object-fit:cover;opacity:1}
    .player-title{position:absolute;z-index:2;top:clamp(.75rem,2vw,1.5rem);left:clamp(.75rem,2vw,1.5rem);display:block;max-width:calc(100% - 2rem);padding:0;color:#fff;font-size:clamp(1rem,2vw,1.5rem);font-weight:700;line-height:1.2;text-shadow:0 2px 5px rgba(0,0,0,.8);overflow-wrap:anywhere;pointer-events:none}
    .player-episode{font-size:clamp(.8rem,1.5vw,1rem);font-weight:600}
    .play-preview{position:absolute;z-index:2;top:50%;left:50%;display:grid;width:clamp(3.25rem,9vw,4.5rem);height:clamp(3.25rem,9vw,4.5rem);place-items:center;transform:translate(-50%,-50%);padding:0;border:0;border-radius:50%;outline:0;box-shadow:none;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;transition:background-color .2s ease;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none}
    .play-preview:focus,.play-preview:focus-visible,.play-preview:active{outline:0;box-shadow:none}
    .play-preview:hover{background:rgba(0,0,0,.78)}
    .play-preview svg{width:clamp(1.2rem,3vw,1.6rem);height:clamp(1.2rem,3vw,1.6rem);fill:currentColor}
    .header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;padding:0 1rem}
    .header button{border:.125rem solid #fff;padding:.4rem .8rem;border-radius:.5rem;cursor:pointer;font-family: inherit;font-size:.85rem;font-weight:600;transition:opacity .2s ease;display:inline-flex;align-items:center;gap:.5rem; -webkit-tap-highlight-color: transparent;}
    #exit{background:transparent;color:#fff;border:.0625rem solid #fff}
    #next{background:#fff;color:#091838}
    .header button:disabled{opacity:.5;cursor:not-allowed;user-select:none;-webkit-user-select:none}
    .header button svg{width:1rem;height:1rem;display:block;flex-shrink:0}
    .list{display:flex;gap:1rem;padding:0 1rem 1rem;overflow-x:auto;width:100%;flex-shrink:0;scroll-behavior:smooth}
    .card{display:flex;flex-direction:column;gap:.4rem;color:inherit;text-decoration:none;cursor:pointer;flex:0 0 14rem;scroll-snap-align:start;min-width:0;outline:0;content-visibility:auto;contain-intrinsic-size:14rem 10rem;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color: transparent;
}
    .card img{width:100%;height:7.875rem;object-fit:cover;border-radius:.5rem;border:0;opacity:0;transition:opacity .15s ease;-webkit-tap-highlight-color:transparent}
    .card img.is-loaded{opacity:1}
    .card.ativo .lesson-thumbnail img{outline:.125rem solid #fff;outline-offset:-.125rem}
    .card:focus img,.card:focus-visible img{box-shadow:none}
    .card span{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%}
    .lesson-thumbnail{position:relative;contain:paint;background-color:#13213b}
    .lesson-thumbnail img{display:block}
    .lesson-duration{position:absolute;right:.5rem;bottom:.5rem;width:auto!important;padding:.15rem .35rem;border-radius:.25rem;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem!important;line-height:1.4;font-variant-numeric:tabular-nums;pointer-events:none}
    .lesson-copy{display:flex;flex-direction:column;gap:.4rem;min-width:0}
    .lesson-episode{order:-1}
    @media (max-width:768px){
      .player-title{line-height:1}
      .player-episode{line-height:1}
      .list{flex-direction:column;overflow-x:visible;scroll-snap-type:none}
      .card{flex:none;width:100%;display:flex;flex-direction:row;align-items:center;gap:.75rem;contain-intrinsic-size:auto 4.5rem}
      .card .lesson-thumbnail{flex:0 0 min(34vw,11rem)}
      .card .lesson-thumbnail img{height:auto;aspect-ratio:16 / 9;object-fit:contain}
      .card .lesson-copy{display:block;flex:1;min-width:0;align-self:flex-start;line-height:1.15}
      .card .lesson-title,.card .lesson-episode{display:block;width:auto;margin:0;padding:0;white-space:normal;line-height:1.15}
      .card .lesson-episode{margin-top:.3rem;font-size:.75rem}
    }
  </style>
</head>

<body>

  <main>

    <section class="player-stage" id="playerStage" aria-label="Prévia da aula">
      <img class="player-preview" id="playerPreview" src="" alt="Prévia da aula">
      <div class="player-title" id="playerTitle">
        <span id="playerLessonTitle"></span><br><span class="player-episode" id="playerEpisode"></span>
      </div>
      <button class="play-preview" id="playPreview" type="button" aria-label="Reproduzir aula">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M32.16,16.08,8.94,4.47A2.07,2.07,0,0,0,6,6.32V29.53a2.06,2.06,0,0,0,3,1.85L32.16,19.77a2.07,2.07,0,0,0,0-3.7Z"></path></svg>
      </button>
    </section>

    <section class="header">
      <button id="exit">
        <svg fill="currentColor" viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.70711 2.29289C6.31658 1.90237 5.68342 1.90237 5.29289 2.29289L0.792893 6.79289C0.402369 7.18342 0.402369 7.81658 0.792893 8.20711L5.29289 12.7071C5.68342 13.0976 6.31658 13.0976 6.70711 12.7071C7.09763 12.3166 7.09763 11.6834 6.70711 11.2929L4 8.5H13.5C14.0523 8.5 14.5 8.05228 14.5 7.5C14.5 6.94772 14.0523 6.5 13.5 6.5H4L6.70711 3.70711C7.09763 3.31658 7.09763 2.68342 6.70711 2.29289Z"/>
        </svg>
        Sair
      </button>

      <button id="next">Próxima Aula</button>
    </section>

    <section class="list" id="list"></section>

  </main>

  <script src="../data.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cursoId = Number(params.get('curso')) || 1;
    const aulaParam = Number(params.get('aula'));

    const course =
      coursesData.find(item => item.id === cursoId) ||
      coursesData[0];

    const lessons = course.lessons;

    const list = document.getElementById('list');
    const exit = document.getElementById('exit');
    const next = document.getElementById('next');
    const playerStage = document.getElementById('playerStage');
    const playerPreview = document.getElementById('playerPreview');
    const playerLessonTitle = document.getElementById('playerLessonTitle');
    const playerEpisode = document.getElementById('playerEpisode');
    const playPreview = document.getElementById('playPreview');
    let playerFrame = null;
    let youtubePlayer = null;
    let playerReady = false;
    let playerApiReady = false;
    let pendingPlayback = false;
    let iframeVideoId = null;
    let preparedVideoId = null;
    let playbackRequested = false;
    let playbackStarted = false;

    let current =
      Number.isInteger(aulaParam) &&
      aulaParam >= 0 &&
      aulaParam < lessons.length
        ? aulaParam
        : 0;

    const getVideoId = videoUrl => {
      const video = new URL(videoUrl);
      const match = video.pathname.match(/\/(?:embed|shorts|live)\/([^/]+)/);
      return match ? match[1] : video.searchParams.get('v');
    };

    const revealThumbnail = image => {
      const loadedSource = image.currentSrc;
      image.decode().then(() => {
        if (image.currentSrc === loadedSource) image.classList.add('is-loaded');
      }).catch(() => {
        if (image.currentSrc === loadedSource && image.complete && image.naturalWidth > 0) {
          image.classList.add('is-loaded');
        }
      });
    };

    const initializeYoutubePlayer = () => {
      if (!playerApiReady || !playerFrame || youtubePlayer) return;
      youtubePlayer = new YT.Player(playerFrame, {
        events: {
          onReady: event => {
            playerReady = true;
            if (preparedVideoId && preparedVideoId !== iframeVideoId) {
              if (playbackRequested) {
                event.target.loadVideoById(preparedVideoId);
                pendingPlayback = false;
              } else {
                event.target.cueVideoById(preparedVideoId);
              }
            } else if (pendingPlayback) {
              event.target.playVideo();
              pendingPlayback = false;
            }
          },
          onStateChange: event => {
            if (event.data === YT.PlayerState.PLAYING) {
              playbackStarted = true;
              playerPreview.hidden = true;
              playerTitle.hidden = true;
              playPreview.hidden = true;
            }
          },
          onAutoplayBlocked: () => {
            if (!playbackStarted) {
              playbackRequested = false;
              pendingPlayback = false;
            }
          }
        }
      });
    };

    window.onYouTubeIframeAPIReady = () => {
      playerApiReady = true;
      initializeYoutubePlayer();
    };

    const youtubeApi = document.createElement('script');
    youtubeApi.src = 'https://www.youtube.com/iframe_api';
    youtubeApi.async = true;
    document.head.appendChild(youtubeApi);

    const preparePlayer = () => {
      const videoId = getVideoId(lessons[current].video);
      preparedVideoId = videoId;

      if (!playerFrame) {
        iframeVideoId = videoId;
        const video = new URL(lessons[current].video);
        video.searchParams.set('autoplay', '0');
        video.searchParams.set('enablejsapi', '1');
        video.searchParams.set('playsinline', '1');
        video.searchParams.set('origin', window.location.origin);

        playerFrame = document.createElement('iframe');
        playerFrame.id = 'youtubePlayerFrame';
        playerFrame.name = 'player';
        playerFrame.allow = 'autoplay; encrypted-media; picture-in-picture';
        playerFrame.allowFullscreen = true;
        playerFrame.title = `Aula: ${lessons[current].title}`;
        playerFrame.src = video.toString();
        playerStage.appendChild(playerFrame);
        initializeYoutubePlayer();
      } else if (playerReady && !playbackRequested) {
        youtubePlayer.cueVideoById(videoId);
      }
    };

    list.innerHTML = lessons.map((item,index) => `
      <div class="card ${index === current ? 'ativo' : ''}">
        <div class="lesson-thumbnail">
          <img src="https://img.youtube.com/vi/${getVideoId(item.video)}/maxresdefault.jpg" data-fallback="${item.thumb}" alt="" loading="lazy" decoding="async" fetchpriority="low">
          ${item.duration ? `<span class="lesson-duration" aria-label="Duração: ${item.duration}">${item.duration}</span>` : ''}
        </div>
        <div class="lesson-copy">
          <span class="lesson-title">${item.title}</span>
          <span class="lesson-episode">Episódio ${index + 1}</span>
        </div>
      </div>
    `).join('');

    const cards = Array.from(
      list.querySelectorAll('.card')
    );

    list.querySelectorAll('.lesson-thumbnail img').forEach(image => {
      image.addEventListener('load', () => revealThumbnail(image));
      image.addEventListener('error', () => {
        image.classList.remove('is-loaded');
        const fallback = image.dataset.fallback;
        if (fallback) {
          image.dataset.fallback = '';
          image.src = fallback;
        }
      });
      if (image.complete && image.naturalWidth > 0) revealThumbnail(image);
    });

    const showPreview = () => {
      preparePlayer();
      const videoId = getVideoId(lessons[current].video);
      const activePreviewUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      playerPreview.src = activePreviewUrl;
      playerPreview.alt = `Prévia: ${lessons[current].title}`;
      playerLessonTitle.textContent = lessons[current].title;
      playerEpisode.textContent = `Episódio ${current + 1}`;
      playerTitle.hidden = false;
      playPreview.hidden = playbackStarted;
      playerStage.setAttribute('aria-label', `Prévia da aula: ${lessons[current].title}`);
    };

    const playCurrent = () => {
      if (playbackRequested) return;
      playbackRequested = true;
      if (playerReady) {
        youtubePlayer.playVideo();
      } else {
        pendingPlayback = true;
      }
    };

    showPreview();
    playPreview.addEventListener('click', playCurrent);

    next.toggleAttribute(
      'disabled',
      current === cards.length - 1
    );

    exit.addEventListener('click',() => {
      window.location.href = '../';
    });

    const update = index => {
      cards[current].classList.remove('ativo');

      current = index;

      cards[current].classList.add('ativo');

      if (playbackRequested) {
        preparedVideoId = getVideoId(lessons[current].video);
        if (playerReady) {
          youtubePlayer.loadVideoById(preparedVideoId);
        } else {
          pendingPlayback = true;
        }
      } else {
        showPreview();
      }

      next.toggleAttribute(
        'disabled',
        current === cards.length - 1
      );

      list.scrollTo({
        left:
          cards[current].offsetLeft -
          parseFloat(getComputedStyle(list).paddingLeft),
        behavior:'smooth'
      });
    };

    list.addEventListener('click',e => {
      const card = e.target.closest('.card');

      if (!card) return;

      const index = cards.indexOf(card);

      if (index === current) return;

      if (index !== -1) {
        update(index);
      }
    });

    next.addEventListener('click',() => {
      if (current < cards.length - 1) {
        update(current + 1);
      }
    });
  </script>

</body>
</html>
