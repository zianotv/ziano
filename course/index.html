<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZianoTV - Detalhes do Curso</title>
    <link rel="icon" type="image/png" href="../assets/images/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=6">
    <link rel="stylesheet" href="../assets/css/couse.css">
</head>
<body class="app-body">
    <div class="app-shell">
        <main class="main-content" style="width: 100%; min-height: 100vh;">
            <header class="main-header" style="display: flex; align-items: center; justify-content: space-between;">
                <a href="../" style="text-decoration: none;">
                    <span class="brand-name">ZianoTV</span>
                </a>
                <div>
                    <a href="../" class="back-btn" style="text-decoration: none;">
                        <i class="bi bi-chevron-left" aria-hidden="true"></i>
                        <span>Voltar ao Catálogo</span>
                    </a>
                </div>
            </header>

            <article class="detail-view">
                <div class="detail-layout">
                    <figure class="detail-poster-frame">
                        <img id="detailPoster" src="" alt="" class="detail-poster" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=80'">
                    </figure>
                    <div class="detail-content">
                        <header>
                            <h2 id="detailTitle" class="detail-title">
                                Carregando...
                            </h2>
                            <dl class="detail-meta">
                                <div><dt>Instrutor:</dt><dd id="detailInstructor">-</dd></div>
                                <div><dt>Categoria:</dt><dd id="detailCategory">-</dd></div>
                                <div><dt>Nível:</dt><dd id="detailLevel">-</dd></div>
                                <div><dt>Duração:</dt><dd id="detailDuration">-</dd></div>
                                <div><dt>Lançamento:</dt><dd id="detailDate">-</dd></div>
                            </dl>
                        </header>
                        <div class="detail-actions">
                            <a id="watchBtn" href="#" class="watch-btn" style="text-decoration: none;">
                                <i class="bi bi-play-fill"></i>
                                <span>Assistir</span>
                            </a>
                            <button id="favoriteBtn" class="favorite-btn">
                                <i id="favIcon" class="bi bi-star"></i>
                                <span id="favText">Favoritar</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <section class="detail-section">
                    <h3 class="detail-section-title">Descrição do Curso:</h3>
                    <p id="detailDescription" class="detail-description">
                    </p>
                </section>
                
                <section class="detail-section lessons-detail-section">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                        <h3 class="detail-section-title" style="margin: 0;">LISTA</h3>
                        <span id="lessonsCountBadge" class="lessons-count-badge"></span>
                    </div>
                    <div class="lessons-container">
                        <ol id="lessonsList" class="lesson-grid">
                        </ol>
                        <nav id="lessonPagination" class="lesson-pagination" aria-label="Paginação de aulas">
                            <button id="lessonPrevBtn" class="pagination-btn" aria-label="Página anterior">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <span id="lessonPaginationStatus" class="pagination-status">Página 1 de 1</span>
                            <button id="lessonNextBtn" class="pagination-btn" aria-label="Próxima página">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </nav>
                    </div>
                </section>
            </article>
        </main>
    </div>

    <script src="../assets/js/data.js?v=3"></script>
    <script src="../assets/js/course.js?v=3"></script>
</body>
</html>
