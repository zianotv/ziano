<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ZianoTV</title>
  <link rel="icon" type="image/png" href="assets/images/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="app">

    <aside id="sidebar" class="sidebar">

      <header class="sidebar-header">
        <div class="brand">ZianoTV</div>

        <button
          id="sidebarToggle"
          class="sidebar-toggle"
          onclick="toggleSidebarCollapse()"
          aria-label="Recolher sidebar"
          aria-expanded="true"
        >
          <i class="bi bi-list"></i>
        </button>

        <button
          id="mobileClose"
          class="mobile-close"
          onclick="toggleSidebar()"
          aria-label="Fechar menu"
          style="display:none"
        >
          <i class="bi bi-x-lg"></i>
        </button>
      </header>

      <nav id="categoryNav" class="category-nav"></nav>

    </aside>

    <main class="main">

      <header class="header">

        <div class="heading">
          <button
            id="mobileMenu"
            class="mobile-menu"
            onclick="toggleSidebar()"
            aria-label="Abrir menu"
            aria-expanded="false"
          >
            <i class="bi bi-list"></i>
          </button>

          <h1 id="categoryTitle" class="header-title">
            Todos os Cursos
          </h1>
        </div>

        <div class="search">
          <i class="bi bi-search"></i>

          <input
            id="searchInput"
            type="search"
            placeholder="Buscar aula..."
            oninput="handleSearch(this.value)"
          >
        </div>

        <nav class="pagination">

          <button
            id="previous"
            onclick="changePage(-1)"
            aria-label="Página anterior"
          >
            <i class="bi bi-chevron-left"></i>
          </button>

          <span id="paginationStatus">
            Página 1 de 1
          </span>

          <button
            id="next"
            onclick="changePage(1)"
            aria-label="Próxima página"
          >
            <i class="bi bi-chevron-right"></i>
          </button>

        </nav>

      </header>

      <section class="catalog">
        <div id="courseGrid" class="grid"></div>
      </section>

    </main>

  </div>

  <button
    id="overlay"
    class="overlay hidden"
    onclick="toggleSidebar()"
    aria-label="Fechar menu"
  ></button>

  <dialog id="courseModal">
    <div id="courseModalContent" class="course-modal"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="assets//js/script.js"></script>

</body>
</html>
