<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZianoTV</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 32'%3E%3Cpath fill='%23ffffff' fill-rule='evenodd' d='M46 30H2a1 1 0 0 1-1-1V1a1 1 0 0 1 1 1h44a1 1 0 0 1 1 1v28a1 1 0 0 1-1 1zM45 2H3v26h42zM21 9a.975.975 0 0 1 .563.2l7.771 4.872a.974.974 0 0 1 .261 1.715l-7.974 4.981A.982.982 0 0 1 21 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM15 32h18a1 1 0 0 1 0 2H15a1 1 0 0 1 0-2z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
    <div id="app" class="app-shell">
        <aside id="sidebar" class="sidebar">
            <header class="sidebar-header">
                <button class="logo-mark" onclick="toggleSidebarCollapse()" aria-label="Recolher sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 32" aria-hidden="true">
                        <path fill="#ffffff" fill-rule="evenodd" d="M46 30H2a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1h44a1 1 0 0 1 1 1v28a1 1 0 0 1-1 1zM45 2H3v26h42zM21 9a.975.975 0 0 1 .563.2l7.771 4.872a.974.974 0 0 1 .261 1.715l-7.974 4.981A.982.982 0 0 1 21 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM15 32h18a1 1 0 0 1 0 2H15a1 1 0 0 1 0-2z"/>
                    </svg>
                </button>
                <div>
                    <h1 class="brand-name">ZianoTV</h1>
                </div>
                <button id="sidebarCollapseToggle" class="sidebar-collapse-toggle" onclick="toggleSidebarCollapse()" aria-label="Recolher sidebar" aria-expanded="true">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <button id="mobileSidebarClose" class="mobile-sidebar-close" onclick="toggleSidebar()" aria-label="Fechar menu">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </header>
            <nav id="categoryNav" aria-label="Categorias de cursos" class="category-nav">
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <div class="category-heading">
                    <button id="mobileMenuToggle" class="mobile-menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menu" aria-expanded="false">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                    <h2 id="categoryTitle" class="category-title">
                        Todas as Aulas
                    </h2>
                </div>
                <div id="headerCatalogControls" class="header-catalog-controls">
                    <search class="search-wrap">
                        <i class="bi bi-search search-icon" aria-hidden="true"></i>
                        <input type="search" id="searchInput" oninput="handleSearch(this.value)" placeholder="Buscar aula..." class="search-input">
                    </search>
                </div>
                <nav id="paginationControls" aria-label="Paginação" class="pagination-nav">
                    <button id="paginationPrevious" onclick="changePage(-1)" aria-label="Página anterior" class="pagination-btn">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <span id="paginationStatus" class="pagination-status">Página 1 de 1</span>
                    <button id="paginationNext" onclick="changePage(1)" aria-label="Próxima página" class="pagination-btn">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </nav>
                <div id="headerDetailControls" class="header-detail-controls is-hidden">
                    <button onclick="showCatalogView()" class="back-btn">
                        <i class="bi bi-arrow-left"></i>
                        <span>Voltar ao Catálogo</span>
                    </button>
                </div>
            </header>
            
            <section id="catalogView" aria-label="Catálogo de Cursos" class="catalog-view">
                <div id="courseGrid" class="course-grid">
                </div>
            </section>
            
            <article id="detailView" class="detail-view is-hidden">
                <div class="detail-layout">
                    <figure class="detail-poster-frame">
                        <img id="detailPoster" src="" alt="" class="detail-poster">
                    </figure>
                    <div class="detail-content">
                        <header>
                            <h2 id="detailTitle" class="detail-title">
                                Titulo da Aula
                            </h2>
                            <dl class="detail-meta">
                                <div><dt>Instrutor:</dt><dd id="detailInstructor"></dd></div>
                                <div><dt>Categoria:</dt><dd id="detailCategory"></dd></div>
                                <div><dt>Nível:</dt><dd id="detailLevel"></dd></div>
                                <div><dt>Duração:</dt><dd id="detailDuration"></dd></div>
                                <div><dt>Lançamento:</dt><dd id="detailDate"></dd></div>
                            </dl>
                        </header>
                        <div class="detail-actions">
                            <button onclick="openPlayerModal()" class="watch-btn">
                                <i class="bi bi-play-fill"></i>
                                <span>Assistir Aula</span>
                            </button>
                            <button onclick="toggleFavoriteCurrent()" id="favoriteBtn" class="favorite-btn">
                                <i id="favIcon" class="bi bi-star"></i>
                                <span id="favText">Favoritar</span>
                            </button>
                        </div>
                    </div>
                </div>
                <section class="detail-section">
                    <h3 class="detail-section-title">Descrição do Curso:</h3>
                    <p id="detailDescription" class="detail-description">
                    </p>
                </section>
                <section class="detail-section">
                    <h3 class="detail-section-title">Aulas e Módulos:</h3>
                    <ol id="lessonsList" class="lesson-grid">
                    </ol>
                </section>
            </article>
        </main>
    </div>
    <button id="sidebarOverlay" class="sidebar-overlay is-hidden" onclick="toggleSidebar()" aria-label="Fechar menu"></button>
    
    <dialog id="videoModal">
        <div>
            <header class="modal-header">
                <div>
                    <h3 id="playerTitle" class="modal-title">Assistindo Aula</h3>
                    <p id="playerInstructor" class="modal-instructor"></p>
                </div>
                <button onclick="closePlayerModal()" aria-label="Fechar reprodutor" class="modal-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </header>
            <div class="modal-video">
                <video id="mainVideoPlayer" controls preload="metadata">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Seu navegador não suporta vídeos HTML5.
                </video>
            </div>
        </div>
    </dialog>
    
    <script src="main.js"></script>
    <script src="data.js"></script>
</body>
</html>
