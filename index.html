<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZianoTV</title>
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body class="app-body">
    <div id="app" class="app-shell">
        <aside id="sidebar" class="sidebar">
            <header class="sidebar-header">
                <button class="logo-mark" onclick="toggleSidebarCollapse()" aria-label="Recolher sidebar">
                    <span aria-hidden="true">Z</span>
                </button>
                <div>
                    <h1 class="brand-name">ZianoTV</h1>
                </div>
                <button id="sidebarCollapseToggle" class="sidebar-collapse-toggle" onclick="toggleSidebarCollapse()" aria-label="Recolher sidebar" aria-expanded="true">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <button id="mobileSidebarClose" class="mobile-sidebar-close" onclick="toggleSidebar()" aria-label="Fechar menu">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </header>
            <nav id="categoryNav" aria-label="Categorias de cursos" class="category-nav">
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <div class="category-heading">
                    <button id="mobileMenuToggle" class="mobile-menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menu" aria-expanded="false">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                    <h2 id="categoryTitle" class="category-title">
                        Todos os Cursos
                    </h2>
                </div>
                <div id="headerCatalogControls" class="header-catalog-controls">
                    <search class="search-wrap">
                        <i class="bi bi-search search-icon" aria-hidden="true"></i>
                        <input type="search" id="searchInput" oninput="handleSearch(this.value)" placeholder="Buscar aula..." class="search-input">
                    </search>
                </div>
                <nav id="paginationControls" aria-label="Paginação" class="pagination-nav">
                    <button id="paginationPrevious" onclick="changePage(-1)" aria-label="Página anterior" class="pagination-btn">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <span id="paginationStatus" class="pagination-status">Página 1 de 1</span>
                    <button id="paginationNext" onclick="changePage(1)" aria-label="Próxima página" class="pagination-btn">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </nav>
            </header>
            
            <section id="catalogView" aria-label="Catálogo de Cursos" class="catalog-view">
                <div id="courseGrid" class="course-grid">
                </div>
            </section>
        </main>
    </div>
    <button id="sidebarOverlay" class="sidebar-overlay is-hidden" onclick="toggleSidebar()" aria-label="Fechar menu"></button>
    
    <script src="./assets/js/data.js?v=2"></script>
    <script src="./assets/js/main.js?v=2"></script>
</body>
</html>
