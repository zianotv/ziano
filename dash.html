<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de dados.js</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        section {
            background-color: var(--surface-color);
            padding: 1.5rem;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        pre {
            background-color: var(--surface-hover);
            padding: 1rem;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            margin: 0;
        }

        .course-card {
            background: var(--surface-hover);
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 1rem;
            align-items: start;
        }

        .course-poster-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .course-poster-container img {
            width: 160px;
            height: 90px;
            object-fit: cover;
        }

        .course-info {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 0.75rem;
            align-items: center;
        }

        .course-meta-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.75rem;
        }

        .course-desc-row {
            grid-column: 1 / -1;
        }

        details {
            grid-column: 1 / -1;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: var(--surface-color);
        }

        summary {
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
        }

        .editable-field {
            padding: 0.25rem 0.5rem;
            border: 1px dashed #94a3b8;
            background: var(--surface-color);
            min-height: 1.5rem;
            outline: none;
            font-size: 0.9rem;
        }

        .editable-field:focus {
            border-style: solid;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .lesson-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0.5rem;
            background: var(--surface-hover);
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Editor de dados.js</h1>
        <span id="course-count">0 cursos</span>
    </header>

    <main>
        <section>
            <h2>Vitrine de Cursos (Edição Direta)</h2>
            <div id="courses-container"></div>
        </section>

        <section>
            <h2>Output (dados.js)</h2>
            <pre><code id="output-code"></code></pre>
        </section>
    </main>

    <script src="assets/js/data.js"></script>
    <script>
        function render() {
            const output = document.getElementById('output-code');
            output.textContent = `const categories = ${JSON.stringify(categories, null, 4)};\n\nconst coursesData = ${JSON.stringify(coursesData, null, 4)};`;
            
            document.getElementById('course-count').textContent = `${coursesData.length} cursos`;
        }

        function buildUI() {
            const container = document.getElementById('courses-container');
            container.innerHTML = '';
            
            coursesData.forEach((course, cIndex) => {
                const card = document.createElement('div');
                card.className = 'course-card';
                
                let lessonsHtml = '';
                course.lessons.forEach((lesson) => {
                    lessonsHtml += `
                        <div class="lesson-row">
                            <span>${lesson.title}</span>
                            <span>${lesson.duration}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="course-poster-container" data-c="${cIndex}">
                        <img src="${course.poster}" alt="Poster" onerror="this.src='https://via.placeholder.com/160x90?text=Erro'">
                        <div class="editable-field" contenteditable="true" data-field="poster" style="font-size: 0.75rem; word-break: break-all;">${course.poster}</div>
                    </div>
                    <div class="course-info" data-c="${cIndex}">
                        <div class="editable-field" contenteditable="true" data-field="title" style="font-weight: bold; font-size: 1rem;">${course.title}</div>
                        <div class="editable-field" contenteditable="true" data-field="category">${course.category}</div>
                        <div class="editable-field" contenteditable="true" data-field="instructor">${course.instructor}</div>
                        <div class="editable-field" contenteditable="true" data-field="level">${course.level}</div>
                        
                        <div class="course-meta-row">
                            <div class="editable-field" contenteditable="true" data-field="duration">${course.duration}</div>
                            <div class="editable-field" contenteditable="true" data-field="date">${course.date}</div>
                            <div class="editable-field" contenteditable="true" data-field="favorite">${course.favorite}</div>
                        </div>

                        <div class="course-desc-row">
                            <div class="editable-field" contenteditable="true" data-field="description">${course.description}</div>
                        </div>

                        <details>
                            <summary>Episódios (${course.lessons.length})</summary>
                            <div class="lessons-list">
                                ${lessonsHtml}
                            </div>
                        </details>
                    </div>
                `;
                container.appendChild(card);
            });

            attachEvents();
            render();
        }

        function attachEvents() {
            document.querySelectorAll('.editable-field').forEach(field => {
                field.addEventListener('input', (e) => {
                    const parent = e.target.closest('[data-c]');
                    const cIndex = parseInt(parent.dataset.c);
                    const fieldName = e.target.dataset.field;
                    let value = e.target.textContent;

                    if (fieldName === 'favorite') {
                        value = value.trim() === 'true';
                    }

                    coursesData[cIndex][fieldName] = value;

                    if (fieldName === 'poster') {
                        const img = parent.querySelector('img');
                        img.src = value;
                    }

                    render();
                });
            });
        }

        buildUI();
    </script>
</body>
</html>
