<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursos</title>

<style>
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:2rem}
header,main{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
nav{display:flex;gap:.5rem}
button{border:0;background:#166534;color:#fff;padding:.7rem 1rem;border-radius:5px;cursor:pointer;font:inherit}
button:hover{background:#14532d}
output{font-weight:600;color:#475569}
section{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
article{background:#fff;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
article img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
article div{padding:1rem}
article h2{font-size:1rem;margin:0 0 .5rem}
article small{color:#64748b}
dialog{border:0;border-radius:6px;padding:1.5rem;max-width:400px}
dialog::backdrop{background:rgba(15,23,42,.35)}
dialog img{display:block;width:100%;margin-bottom:1rem}
dialog menu{display:flex;justify-content:flex-end;gap:.5rem;padding:0;margin:1rem 0 0}
</style>
</head>

<body>

<header>
    <output id="count">0 cursos</output>

    <nav>
        <button onclick="file.click()">
            Importar curso
        </button>

        <button onclick="downloadFile()">
            Baixar data.js
        </button>
    </nav>
</header>

<input id="file" type="file" accept=".json" hidden>

<main>
    <section id="courses"></section>
</main>

<dialog id="preview">
    <img id="previewImage" alt="">
    <h2 id="previewTitle"></h2>
    <small id="previewLessons"></small>

    <menu>
        <button onclick="preview.close()">Cancelar</button>
        <button onclick="importCourse()">Importar</button>
    </menu>
</dialog>

<script src="data.js"></script>

<script>

let importedCourse=null;

function render(){

    courses.innerHTML='';

    count.value=`${coursesData.length} cursos`;

    coursesData.forEach(course=>{

        const article=document.createElement('article');

        article.innerHTML=`
            <img
                src="${course.poster}"
                alt="${course.title}"
                onerror="this.src='https://via.placeholder.com/640x360?text=Sem+imagem'"
            >
            <div>
                <h2>${course.title}</h2>
                <small>${course.lessons?.length||0} aulas</small>
            </div>
        `;

        courses.appendChild(article);

    });

}


file.onchange=async event=>{

    const selectedFile=event.target.files[0];

    if(!selectedFile)return;

    try{

        const text=await selectedFile.text();

        const course=JSON.parse(text);

        if(
            !course ||
            typeof course!=='object' ||
            !course.title ||
            !course.poster ||
            !Array.isArray(course.lessons)
        ){

            throw new Error('JSON de curso inválido.');

        }

        importedCourse=course;

        previewImage.src=course.poster;
        previewImage.alt=course.title;

        previewTitle.textContent=course.title;

        previewLessons.textContent=
            `${course.lessons.length} aulas`;

        preview.showModal();

    }catch(error){

        alert('O arquivo não contém um curso JSON válido.');

        console.error(error);

    }

    file.value='';

};


function importCourse(){

    if(!importedCourse)return;

    const exists=coursesData.some(
        course=>Number(course.id)===Number(importedCourse.id)
    );

    if(exists){

        alert('Esse curso já existe no data.js.');

        return;

    }

    coursesData.push(importedCourse);

    importedCourse=null;

    preview.close();

    render();

}


function downloadFile(){

    const content=
        `const categories = ${JSON.stringify(categories,null,4)};\n\n`+
        `const coursesData = ${JSON.stringify(coursesData,null,4)};`;

    const blob=new Blob(
        [content],
        {type:'text/javascript'}
    );

    const url=URL.createObjectURL(blob);

    const link=document.createElement('a');

    link.href=url;
    link.download='data.js';

    link.click();

    URL.revokeObjectURL(url);

}


render();

</script>

</body>
</html>
